schema: spec-driven

context: |
  Language: ru
  All artifacts must be written in ru.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Проект: @dkukushkin/3d-pano — собственная, независимая от фреймворков библиотека панорам и
  виртуальных туров на WebGL2 (ядро без зависимостей + точка входа /react). Цель — паритет
  возможностей с коммерческими движками при собственном читаемом и безопасном коде.
  Главный потребитель — talent.frontends.neometria (src/widgets/panorama-tour).

  Перед любым артефактом прочитай openspec/constitution.md (принципы), openspec/roadmap.md (этапы)
  и openspec/parity.md (матрица возможностей). Ключевое:
  - Чистая комната: никогда не открывать файлы проприетарных движков; чужие имена API в нашем API
    и коде запрещены (список — в локальном scripts/clean-room.local.json вне git).
  - Конфигурация тура — данные (JSON), поведение — JS/TS API; встроенного скриптового языка нет.
  - Рендер — собственный WebGL2 без зависимостей.
  - Углы публичного API в градусах: yaw растёт вправо, pitch — вверх. Мир: X вправо, Y вверх,
    Z вперёд (yaw 0).
  - Хотспоты: DOM-элементы хоста + SVG-полигоны + WebGL-поверхности для 3D/VR; своей системы
    UI-слоёв нет.
  - README и docs/ для интеграторов — на английском; спецификации, JSDoc и коммиты — на русском.
  - Всё, что агент придумал сам (имена API, форматы, структура, зависимости, объём), выносится
    пользователю на согласование до реализации.

rules:
  proposal:
    - Указать этап из roadmap.md (M1…M5) и строки parity.md, которые закрывает изменение
    - Обязательный раздел «Вне рамок» с причинами
    - Перечислить решения, придуманные агентом, — они уходят на согласование
  design:
    - Раздел «Решения» — таблица «решение / альтернативы / статус», где статус либо «согласовано», либо «ждёт согласования»
    - Для каждого модуля указать ответственность и то, чистый он или с побочными эффектами
    - Формулы, которые есть и в GLSL, и в TypeScript, перечислить явно — они покрываются контракт-тестами
  specs:
    - Каждое требование проверяемо; в сценарии указать, чем проверяется (контракт-тест node --test или сценарий песочницы)
    - Публичные имена только из согласованного контракта API
  tasks:
    - Задачи сгруппированы так, чтобы каждая группа заканчивалась логическим коммитом (Conventional Commits на русском)
    - Каждая задача ссылается на требование, которое закрывает
    - Последние задачи изменения — документация для интеграторов (README.md, docs/) и зелёный pnpm check

operations:
  apply:
    guidance:
      - Не начинать, пока в design.md остаются решения «ждёт согласования»
      - После каждой группы задач — pnpm check и коммит без трейлеров Co-authored-by
      - Обнаружил, что нужно решение вне спецификации, — остановись и спроси пользователя
  archive:
    guidance:
      - Перед архивом убедиться, что README.md и docs/ отражают итоговый публичный API
